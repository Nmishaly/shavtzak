<script>
// ===== Scheduling engine (pure functions, no DOM) =====
const HAMAL_ROLES = { none: 'ללא', backup: 'גיבוי', dedicated: 'ייעודי', only: 'חמ"ל בלבד' };

function uid(prefix) { return prefix + Math.random().toString(36).slice(2, 8); }
function fdiv(a, b) { return Math.floor(a / b); }
function mod(a, b) { return ((a % b) + b) % b; }
function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }
function fmtDate(ms) { const d = new Date(ms); return d.toISOString().slice(0, 10); }
function addDays(s, n) { return fmtDate(parseDate(s) + n * 86400000); }
function dayDiff(a, b) { return Math.round((parseDate(b) - parseDate(a)) / 86400000); }
function weekdayOf(s) { return new Date(parseDate(s)).getUTCDay(); }
function t2hh(str) { if (!str) return 0; const [a, b] = str.split(':').map(Number); return a + (b || 0) / 60; }
// 'YYYY-MM-DDTHH:MM' -> hours from week start 00:00
function dtToH(dt, ws) { return dayDiff(ws, dt.slice(0, 10)) * 24 + t2hh(dt.slice(11, 16)); }
function hToDt(h, ws) { const d = Math.floor(h / 24); return addDays(ws, d) + 'T' + clock(h); }
// Scheduling period: from startHour on the start day to endHour on the same weekday a week later.
function period(cfg) {
  const R = cfg.rules, C = R.changeover;
  const P0 = R.periodStartHour == null ? C : R.periodStartHour;
  const P1 = 168 + (R.periodEndHour == null ? P0 : R.periodEndHour);
  const d0 = Math.floor((P0 - C) / 24), d1 = Math.floor((P1 - 1e-9 - C) / 24);
  const days = []; for (let d = d0; d <= d1; d++) days.push(d);
  return { P0, P1, d0, d1, days };
}
function periodStartOf(cfg, dateStr, hourNow) {
  const sd = cfg.rules.periodStartDay == null ? 0 : cfg.rules.periodStartDay;
  let back = mod(weekdayOf(dateStr) - sd, 7);
  if (back === 0 && hourNow != null && hourNow < period(cfg).P0) back = 7;

// ----- load dashboard -----
function balCell(b) {
  const cls = b.surplus < -0.05 ? 'short' : b.surplus < 1 ? 'tight' : 'good';
  const sign = b.surplus > 0.05 ? '+' : b.surplus < -0.05 ? '−' : '';
  const ratio = isFinite(b.ratio) ? `${S.cfg.rules.shift}/${Math.max(0, b.ratio).toFixed(1)}` : '—';
  return `<div class="bal ${cls}" title="יכולת ${b.cap.toFixed(0)} מול דרישה ${b.demand} שעות שמירה"><b class="ltr">${sign}${Math.abs(b.surplus).toFixed(1)}</b><span class="ltr">${ratio}</span></div>`;
}
function platoonStatus(p) {
  const P = period(S.cfg);
  const a = p.arrive ? dtToH(p.arrive, S.ws) : -1e9, d = p.depart ? dtToH(p.depart, S.ws) : 1e9;
  if (a <= P.P0 && d >= P.P1) return 'במוצב כל התקופה';
  if (d <= P.P0 || a >= P.P1) return 'לא במוצב בתקופה הזו';
  return [a > P.P0 ? 'מגיעה ' + fmtDTplain(p.arrive) : '', d < P.P1 ? 'יוצאת ' + fmtDTplain(p.depart) : ''].filter(Boolean).join(' · ');
}
function fmtDTplain(dt) { const d = dt.slice(0, 10); return `${DAY_NAMES[weekdayOf(d)]} ${ddmm(d)} ${dt.slice(11, 16)}`; }
function renderLoad() {
  const v = analysis(); if (!v) return '';

  const active = cfg.people.filter(p => p.active !== false).length;
  const out = new Set(weekAbsences().map(x => x.p.id)).size;
  const worst = lm.reduce((a, d) => d.minSurplus < a ? d.minSurplus : a, Infinity);
  let html = staleBanner();
  html += `<div class="tiles">
    <div class="tile"><span class="k">סד"כ פעיל</span><span class="v">${active}</span><span class="s">${cfg.people.filter(p => p.active !== false && p.cmdr).length} מפקדים · ${cfg.people.filter(p => p.active !== false && isHamalPerson(p)).length} חמ"ל ייעודי</span></div>

    <div class="tile"><span class="k">שמירה ממוצעת ללוחם</span><span class="v">${(ws.avgGuard / 7).toFixed(1)}</span><span class="s">שעות ביום · ${ws.avgDeep.toFixed(1)} קימות לילה בשבוע</span></div>
    <div class="tile ${v.errors ? 'bad' : ''}"><span class="k">חריגות בשיבוץ</span><span class="v">${v.errors}</span><span class="s">מתוך השבוע הנוכחי</span></div>

  html += renderWhatIfForm();

let baseMemo = { key: null, val: null };
function scenario(cfg) {
  const doc = generateWeek(cfg, S.ws, null, null, { varW: 0 }); const v = validateWeek(cfg, doc);
  const lm = loadMetrics(cfg, v); const st = weekStats(cfg, v);
  return { errors: v.errors, avg: st.avgGuard, deep: st.avgDeep, worst: Math.min(...lm.map(d => d.minSurplus)), shortH: lm.reduce((s, d) => s + d.shortH, 0), shortDays: lm.filter(d => d.minSurplus < -0.05).length, lm };
}
function runWhatIf(change, label, from) {
  const key = JSON.stringify(S.cfg);
  if (baseMemo.key !== key) baseMemo = { key, val: scenario(S.cfg) };
  const cfg2 = JSON.parse(key); change(cfg2);
  const after = scenario(cfg2);
  S.whatif = { label, before: baseMemo.val, after, from, change };
  render();
  const el = document.getElementById('wiResult'); if (el) el.scrollIntoView({ block: 'nearest' });
}
function renderWhatIfResult() {
  const w = S.whatif; const b = w.before, a = w.after;
  const row = (name, x, y, fmt0, worseUp) => { const fmt = z => `<span class="ltr">${z < 0 ? '−' : ''}${fmt0(Math.abs(z))}</span>`; const dlt = y - x; const cls = Math.abs(dlt) < 0.05 ? '' : ((dlt > 0) === worseUp ? 'up' : 'down'); return `<tr><td>${name}</td><td class="num">${fmt(x)}</td><td class="num ${cls}">${fmt(y)}</td><td class="num ${cls}">${Math.abs(dlt) < 0.05 ? '—' : `<span class="ltr">${dlt > 0 ? '+' : '−'}${fmt0(Math.abs(dlt))}</span>`}</td></tr>`; };
  const f1 = x => (Math.round(x * 10) / 10).toString(), f0 = x => String(Math.round(x));
  const dShort = a.shortH - b.shortH, dAvg = a.avg - b.avg;
  const verdict = dShort > 0.5 ? `השינוי מוסיף כ-${Math.round(dShort)} שעות שמירה בשבוע שאי אפשר לכסות ב-${S.cfg.rules.shift}/${S.cfg.rules.minRest}. הנשארים ישמרו עם פחות מנוחה.` : dAvg > 0.05 ? `אפשר לעמוד ביעד, אבל כל לוחם שנשאר ישמור בממוצע עוד ${Math.round(dAvg * 60)} דקות בשבוע.` : 'לשינוי אין השפעה מורגשת על הנשארים.';
  return `<div class="panel pad section" id="wiResult"><div class="row" style="justify-content:space-between"><h2>ההשפעה: ${esc(w.label)}</h2><button class="btn sm" data-act="wiClose">סגור</button></div>
  <p style="margin:0;font-weight:600">${verdict}</p>
  <div class="gridwrap"><table class="tbl cmp" style="min-width:460px"><thead><tr><th>מדד לשבוע</th><th>בלי השינוי</th><th>עם השינוי</th><th>הפרש</th></tr></thead><tbody>
    ${row('שעות שמירה שלא ניתן לכסות ביעד המנוחה', b.shortH, a.shortH, f0, true)}

function openEvMemberDialog(evId, i) {

  }
  if (ds.plclear) { const p = S.cfg.platoons.find(x => x.id === ds.plclear); p.arrive = ''; p.depart = ''; cfgChanged(); return true; }

    cfgChanged(); toast('הרכב הפעילות עודכן'); return true;
  }
  if (ds.evauto) { const ev = S.cfg.events.find(x => x.id === ds.evauto); delete ev.pinned; cfgChanged(); toast('הפעילות תאויש אוטומטית בעדכון השיבוץ'); return true; }
  if (ds.evdel) { S.cfg.events = S.cfg.events.filter(x => x.id !== ds.evdel); cfgChanged(); toast('הפעילות נמחקה'); return true; }
  const act = ds.act; if (!act) return false;
  const readAbs = (pfx, pid, kindId, noteId) => {

    if (to <= from) { toast('שעת החזרה צריכה להיות אחרי היציאה'); return null; }
    return { id: newId('a'), from, to, kind: $('#' + kindId) ? $('#' + kindId).value : 'home', note: $('#' + noteId) ? $('#' + noteId).value.trim() : '' };
  };
  const readEv = () => {
    const name = ($('#ev-name').value || '').trim() || 'פעילות מיוחדת';
    const date = $('#ev-date').value; if (!date) { toast('צריך לבחור תאריך'); return null; }
    return { id: newId('e'), name, date, from: t2h($('#ev-from').value), to: t2h($('#ev-to').value), size: +$('#ev-size').value || 0, cmdrs: +$('#ev-cmd').value || 0, source: $('#ev-src').value };
  };
  if (act === 'absAdd' || act === 'dabAdd') {
    const pid = act === 'absAdd' ? $('#ab-p').value : $('#modal').dataset.abs;
    const a = act === 'absAdd' ? readAbs('ab', pid, 'ab-k', 'ab-n') : readAbs('dab', pid, 'dab-k', 'dab-n'); if (!a) return true;
    const p = S.cfg.people.find(x => x.id === pid); p.abs = [...(p.abs || []), a];
    cfgChanged(); toast(`נוספה יציאה ל${p.name}`);
    if (act === 'dabAdd') openAbsDialog(pid); return true;
  }
  if (act === 'absWhatIf') {
    const pid = $('#ab-p').value; const a = readAbs('ab', pid, 'ab-k', 'ab-n'); if (!a) return true;
    const p = S.cfg.people.find(x => x.id === pid);
    runWhatIf(c => { const q = c.people.find(x => x.id === pid); q.abs = [...(q.abs || []), a]; }, `יציאה של ${p.name}`, 'leave');
    S.whatif.commit = () => { p.abs = [...(p.abs || []), a]; cfgChanged(); toast(`נוספה יציאה ל${p.name}`); }; S.whatif.commitLabel = 'הוסף את היציאה'; render(); return true;
  }
  if (act === 'evAdd') { const ev = readEv(); if (!ev) return true; S.cfg.events = [...(S.cfg.events || []), ev]; cfgChanged(); toast('הפעילות נוספה. עדכן את השיבוץ כדי לשבץ אליה לוחמים'); return true; }
  if (act === 'evWhatIf') {
    const ev = readEv(); if (!ev) return true;
    runWhatIf(c => { c.events = [...(c.events || []), ev]; }, ev.name, 'leave');
    S.whatif.commit = () => { S.cfg.events = [...(S.cfg.events || []), ev]; cfgChanged(); toast('הפעילות נוספה'); }; S.whatif.commitLabel = 'הוסף את הפעילות'; render(); return true;
  }
  if (act === 'wiRunLeave') {
    const pid = $('#wi-p').value; const from = readDT('wi-from'), to = readDT('wi-to');
    if (!from || !to || to <= from) { toast('שעת החזרה צריכה להיות אחרי היציאה'); return true; }
    S.wiPid = pid; S.wiFrom = from; S.wiTo = to;
    const p = S.cfg.people.find(x => x.id === pid); const a = { id: newId('a'), from, to, kind: 'home', note: '' };
    runWhatIf(c => { const q = c.people.find(x => x.id === pid); q.abs = [...(q.abs || []), a]; }, `יציאה של ${p.name}`, 'load');
    S.whatif.commit = () => { p.abs = [...(p.abs || []), a]; cfgChanged(); toast(`נוספה יציאה ל${p.name}`); }; S.whatif.commitLabel = 'הוסף את היציאה'; render(); return true;
  }
  if (act === 'wiRunEvent') {
    const ev = { id: newId('e'), name: 'פעילות מיוחדת', date: $('#wi-ed').value, from: t2h($('#wi-ef').value), to: t2h($('#wi-et').value), size: +$('#wi-es').value || 0, cmdrs: +$('#wi-ec').value || 0, source: 'any' };

  }
  if (act === 'wiCommit') { const w = S.whatif; S.whatif = null; w.commit(); return true; }
  if (act === 'wiClose') { S.whatif = null; render(); return true; }
  if (act === 'demo') { S.local = true; S.cfg = defaultConfig(); ensureDraft(); render(); return true; }
  return false;
}

function snapshotData() {
  const doc = currentDoc(), v = analysis(), cfg = S.cfg, R = cfg.rules, T = cfg.tasks, P = period(cfg);
  const C = R.changeover, L = R.shift, SC = T.standbyChange == null ? C : T.standbyChange;
  const names = arr => (arr || []).map(id => id ? pname(id) : 'חסר');
  const dayLabel = d => { const ds = addDays(S.ws, d); return { name: DAY_NAMES[weekdayOf(ds)], date: ddmm(ds) }; };
  const byJ = {}; v.geo.cells.forEach(c => { ((byJ[c.j] = byJ[c.j] || {})[c.post] = (byJ[c.j][c.post] || [])).push(c); });
  const days = P.days.map(d => {
    const D = doc.days[d] || { sb: [], cv: [], kitchen: [] };
    const a = Math.max(24 * d + C, P.P0), b = Math.min(24 * d + C + 24, P.P1);
    const rows = [];
    for (let j = Math.floor((a - C) / L); C + j * L < b - 1e-9; j++) {
      const s = Math.max(C + j * L, a), e = Math.min(C + (j + 1) * L, b); if (e - s < 1e-9) continue;
      const hc = v.geo.hamal.find(h => h.s <= s + 1e-9 && h.e > s + 1e-9);
      const ham = !hc ? null : { name: doc.cells[hc.key] ? pname(doc.cells[hc.key]) : 'חסר', time: `${h2t(hc.s)}–${h2t(hc.e)}`, first: !rows.length || !rows[rows.length - 1].ham || rows[rows.length - 1].ham.key !== hc.key, key: hc.key };
      rows.push({ time: `${h2t(s)}–${h2t(e)}`, night: mod(s, 24) >= 22 || mod(s, 24) < 6, cells: cfg.posts.map(p => { const cs = (byJ[j] || {})[p.id]; return cs ? cs.map(c => doc.cells[c.key] ? pname(doc.cells[c.key]) : 'חסר') : null; }), ham });
    }
    rows.forEach((r, i) => { if (r.ham && r.ham.first) { let n = 1; while (rows[i + n] && rows[i + n].ham && rows[i + n].ham.key === r.ham.key) n++; r.ham.span = n; } });
    const absent = [];
    for (const p of cfg.people) for (const x of absIntervals(cfg, p, S.ws)) if (x.s < b && x.e > a && x.a.kind !== 'platoon') absent.push(p.name);
    const plAway = cfg.platoons.filter(pl0 => { const m = cfg.people.find(p => p.pl === pl0.id); return m && absIntervals(cfg, m, S.ws).some(x => x.a.kind === 'platoon' && x.s <= a && x.e >= b); }).map(x => x.name);
    return Object.assign(dayLabel(d), {
      sb: { pl: pl(D.sbPl), names: names(D.sb), time: `החלפה ${h2t(SC)}` }, cv: { pl: pl(D.cvPl), names: names(D.cv), time: `${h2t(T.convoyFrom)}–${h2t(T.convoyTo)}` },
      kitchen: names(D.kitchen), absent: [...new Set(absent)], plAway,
      events: weekEvents(cfg, S.ws).filter(ev => Math.floor((ev.s - C) / 24) === d).map(ev => ({ name: ev.name, time: `${h2t(ev.from)}–${h2t(ev.to)}`, names: names((doc.events || {})[ev.id]) })),
      hamal: v.geo.hamal.filter(h => h.s < b && h.e > a).map(h => ({ time: `${h2t(h.s)}–${h2t(h.e)}`, name: doc.cells[h.key] ? pname(doc.cells[h.key]) : 'חסר' })),
      rows,
    });
  });
  const people = cfg.people.filter(p => p.active !== false).map(p => {
    const items = [];
    for (const x of v.st.work[p.id] || []) items.push({ t: x.s, what: x.kind === 'hamal' ? 'משמרת חמ"ל' : postName(cfg, x.post), time: `${h2t(x.s)}–${h2t(x.e)}` });
    for (const x of v.st.duty[p.id] || []) {
      if (!['standby', 'convoy', 'kitchen', 'event', 'off'].includes(x.type)) continue;
      if (x.e <= P.P0 || x.s >= P.P1) continue;
      items.push({ t: Math.max(x.s, P.P0), what: x.type === 'event' ? x.label : x.type === 'off' ? 'יציאה' : DUTY_NAMES[x.type], time: x.type === 'standby' ? `מ-${h2t(x.s)} ל-24 שעות` : `${h2t(x.s)}–${h2t(x.e)}` });
    }
    items.sort((a, b) => a.t - b.t);
    return { name: p.name, pl: pl(p.pl), cmdr: !!p.cmdr, items: items.map(it => { const d = Math.floor((it.t - C) / 24); const l = dayLabel(d); return { day: `${l.name} ${l.date}`, what: it.what, time: it.time }; }) };
  });
  const first = dayLabel(P.d0), last = dayLabel(P.d1);
  return { range: `${first.name} ${first.date} ${h2t(P.P0)} – ${last.name} ${last.date} ${h2t(P.P1)}`, made: new Date().toLocaleString('he-IL'), posts: cfg.posts.map(p => p.name), days, people };
}

// ---------- actions ----------

function dayText(d) {
  const doc = currentDoc(), v = analysis(), R = S.cfg.rules, T = S.cfg.tasks; const D = doc.days[d]; const ds = addDays(doc.ws, d);
  const names = arr => arr.map(id => id ? pname(id) : 'חסר').join(', ');
  const lines = [`שיבוץ יום ${DAY_NAMES[weekdayOf(ds)]} ${ddmm(ds)}`, `כוננות (${pl(D.sbPl)}): ${names(D.sb)}`, `שיירות (${pl(D.cvPl)}): ${names(D.cv)}`, `מטבח: ${names(D.kitchen)}`];
  weekEvents(S.cfg, S.ws).filter(ev => Math.floor((ev.s - R.changeover) / 24) === d).forEach(ev => lines.push(`${ev.name} ${trange(ev.from, ev.to, '-')}: ${names((doc.events || {})[ev.id] || [])}`));
  const ham = v.geo.hamal.filter(h => h.s < 24 * d + R.changeover + 24 && h.e > 24 * d + R.changeover);
  lines.push('חמ"ל: ' + ham.map(h => `\u2066${h2t(h.s)}\u2069 ${doc.cells[h.key] ? pname(doc.cells[h.key]) : 'חסר'}`).join(' | '), '');
  const P = period(S.cfg); const dA = Math.max(24 * d + R.changeover, P.P0), dB = Math.min(24 * d + R.changeover + 24, P.P1);
  for (let j = Math.floor((dA - R.changeover) / R.shift); R.changeover + j * R.shift < dB - 1e-9; j++) {
    const s = Math.max(R.changeover + j * R.shift, dA), e = Math.min(R.changeover + (j + 1) * R.shift, dB); if (e - s < 1e-9) continue;
    const parts = S.cfg.posts.map(p => { const cs = v.geo.cells.filter(c => c.j === j && c.post === p.id); return cs.length ? `${p.name}: ${cs.map(c => doc.cells[c.key] ? pname(doc.cells[c.key]) : 'חסר').join(', ')}` : null; }).filter(Boolean);
    lines.push(`${trange(s, e, '-')} | ${parts.join(' | ')}`);
  }
  return lines.join('\n');
}

    toast(`${pname(id)} שובץ ונעול`); return;
  }
  if (ds.clear) { const key = ds.clear; closeDialog(); patchWeek({ cells: { [key]: null }, locks: { [key]: true } }, doc => { doc.cells[key] = null; doc.locks[key] = true; }); return; }
  if (ds.unlock) { const key = ds.unlock; closeDialog(); patchWeek({ locks: { [key]: false } }, doc => { doc.locks[key] = false; }); toast('הנעילה בוטלה'); return; }
  if (ds.dpick) {
    const kind = $('#modal').dataset.duty, i = +$('#modal').dataset.i, id = ds.dpick, d = S.day; closeDialog();
    const doc = currentDoc(); const D = JSON.parse(JSON.stringify(doc.days[d]));
    ['sb', 'cv', 'kitchen'].forEach(k => { if (k !== kind) D[k] = D[k].map(x => x === id ? null : x); });
    D[kind][i] = id; D.manual = true;
    patchWeek({ days: { [d]: D } }, dd => { dd.days[d] = D; }); toast('הוחלף. כדאי לשבץ מחדש את העמדות'); return;
  }
  if (ds.del) { S.cfg.people = S.cfg.people.filter(p => p.id !== ds.del); cfgChanged(); return; }
  if (ds.delpost) { S.cfg.posts = S.cfg.posts.filter(p => p.id !== ds.delpost); cfgChanged(); return; }
  if (ds.delpl) {
    const id = ds.delpl; if (S.cfg.people.some(p => p.pl === id)) { toast('יש לוחמים במחלקה. העבר אותם קודם למחלקה אחרת'); return; }
    S.cfg.platoons = S.cfg.platoons.filter(p => p.id !== id); S.cfg.organic = S.cfg.organic.filter(x => x !== id); cfgChanged(); return;
  }
  const act = ds.act;
  if (!act) return;
  if (act === 'seed') { S.cfg = defaultConfig(); cfgDirty = true; flushCfg(); S.draft = null; ensureDraft(); render(); }
  else if (act === 'saveDraft') { saveWholeWeek(S.draft); toast('השיבוץ נשמר ופורסם'); }
  else if (act === 'regen') regen();
  else if (act === 'unlockAll') { const locks = {}; Object.keys(S.week.locks || {}).forEach(k => locks[k] = false); patchWeek({ locks }, doc => { doc.locks = locks; }); toast('כל הנעילות שוחררו'); }
  else if (act === 'copyDay') copyText(dayText(S.day));
  else if (act === 'pdf') openPdfDialog();
  else if (act === 'pdfGo') { const md = $('#modal'); exportPdf({ scope: md.dataset.pdfscope || 'day', people: $('#pdf-people').checked, gray: $('#pdf-gray').checked }); }
  else if (act === 'snapshot') {
    try { await S.downloads.save({ filename: `shibutz-${S.ws}.html`, data: snapshotHtml() }); toast('הקובץ מוכן לשליחה'); } catch (er) { if (er && er.code !== 'declined') toast('ההורדה לא הצליחה'); }
  }
  else if (act === 'csv') {
    try { await S.downloads.save({ filename: `schedule-${S.ws}.csv`, data: weekCsv() }); } catch (er) { if (er && er.code !== 'declined') toast('ההורדה לא הצליחה'); }
  }
  else if (act === 'addPerson') newPerson(false);
  else if (act === 'addCmdr') newPerson(true);
  else if (act === 'addPost') { S.cfg.posts.push({ id: 'po' + Math.random().toString(36).slice(2, 7), name: 'עמדה חדשה', count: 1, from: 0, to: 0 }); cfgChanged(); }
  else if (act === 'addPl') { S.cfg.platoons.push({ id: 'pl' + Math.random().toString(36).slice(2, 7), name: 'מחלקה חדשה' }); cfgChanged(); }
  else if (act === 'resetCfg') { const r = (S.cfg.rev || 0) + 1; S.cfg = defaultConfig(); S.cfg.rev = r; cfgChanged(); toast('ההגדרות אופסו'); }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'candSearch') { const q = t.value.trim(); document.querySelectorAll('#modal [data-name]').forEach(b => b.hidden = q && !b.dataset.name.includes(q)); return; }
  if (t.matches('input[type=text]')) applyField(t, false);
});
document.addEventListener('change', e => { const t = e.target; if (t.id === 'candSearch' || t.id === 'offAdd') return; applyField(t, true); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal').innerHTML) closeDialog(); });

function applyField(t, rerender) {
  if (!S.cfg || !S.canWrite) return;
  const tr = t.closest('[data-pid]');
  if (tr && t.dataset.f) {
    const p = S.cfg.people.find(x => x.id === tr.dataset.pid); const f = t.dataset.f;
    if (t.type === 'checkbox') p[f] = t.checked; else p[f] = t.value;
    if (f === 'cmdr' && p.cmdr) p.noKitchen = true;
    if (f === 'hamal' && (p.hamal === 'dedicated' || p.hamal === 'only')) p.squad = 'auto';
    cfgChanged({ noRender: !rerender || t.type === 'text' }); return;
  }
  const pr = t.closest('[data-post]');
  if (pr && t.dataset.pf) {
    const p = S.cfg.posts.find(x => x.id === pr.dataset.post); const f = t.dataset.pf;
    if (f === 'name') p.name = t.value;
    else if (f === 'count') p.count = Math.max(1, Math.min(6, parseInt(t.value) || 1));
    else if (f === 'always') { if (t.checked) { p.from = 0; p.to = 0; } else { p.from = 22; p.to = 7; } }
    else p[f] = t2h(t.value);
    cfgChanged({ noRender: f === 'name' || !rerender }); return;
  }
  if (t.dataset.plname) { const p = S.cfg.platoons.find(x => x.id === t.dataset.plname); p.name = t.value; cfgChanged({ noRender: true }); return; }
  if (t.dataset.org !== undefined) { S.cfg.organic[+t.dataset.org] = t.value; cfgChanged(); return; }
  if (t.dataset.anchor) { if (t.value) { S.cfg.cycleAnchor = t.value; cfgChanged(); } return; }
  if (t.dataset.cfg) {
    let v = t.dataset.time ? t2h(t.value) : parseFloat(t.value);
    if (!isFinite(v)) return;
    if (t.dataset.cfg === 'rules.shift' && (24 % v)) { toast('אורך המשמרת חייב לחלק את היממה (1, 2, 3 או 4)'); render(); return; }
    if (t.dataset.cfg === 'rules.variety') v = Math.max(0, Math.min(10, v));
    setPath(t.dataset.cfg, v);
    if (/^rules\.period/.test(t.dataset.cfg)) { S.ws = currentPeriodStart(S.cfg); S.wsTouched = false; S.day = todayIndex(S.cfg, S.ws); cfgChanged({ noRender: true }); subscribeWeek(); return; }
    cfgChanged({ noRender: !rerender });
  }
}
</script>
